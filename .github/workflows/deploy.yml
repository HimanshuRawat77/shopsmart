name: ShopSmart Pipeline (Build and Push)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests and Generate Report
        run: |
          mkdir -p test-results
          npm run test -- --run --reporter=default --reporter=junit --outputFile=./test-results/vitest-junit.xml

      - name: Upload Frontend Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-vitest-report
          path: client/test-results/vitest-junit.xml

      - name: Build Frontend
        run: npm run build

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests and Generate Report
        run: |
          mkdir -p test-results
          npm test -- --json --outputFile=./test-results/jest-results.json

      - name: Upload Backend Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jest-report
          path: server/test-results/jest-results.json

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Root Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Build Frontend
        run: npm run build
        working-directory: client

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    name: Terraform, Docker, and ECS Deploy
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
      - backend-tests
      - e2e-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init with S3 State
        run: |
          # Trim whitespace from secrets
          REGION=$(echo "${{ secrets.AWS_REGION }}" | xargs)
          BUCKET=$(echo "${{ secrets.TERRAFORM_STATE_BUCKET }}" | xargs)
          
          terraform init \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=$REGION"
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
        run: terraform plan -out=tfplan
        working-directory: ./terraform

      - name: Terraform Apply Infrastructure Prerequisites
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -target=aws_s3_bucket.app_bucket \
            -target=aws_s3_bucket_versioning.app_bucket_versioning \
            -target=aws_s3_bucket_server_side_encryption_configuration.app_bucket_encryption \
            -target=aws_s3_bucket_public_access_block.app_bucket_public_access
        working-directory: ./terraform

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/shopsmart-repo:latest
            ${{ steps.login-ecr.outputs.registry }}/shopsmart-repo:${{ github.sha }}

      - name: Terraform Apply ECS Deployment
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve
        working-directory: ./terraform

      - name: Verify ECS Service
        run: |
          aws ecs wait services-stable \
            --cluster shopsmart-cluster \
            --services shopsmart-service \
            --region ${{ secrets.AWS_REGION }}

          aws ecs describe-services \
            --cluster shopsmart-cluster \
            --services shopsmart-service \
            --region ${{ secrets.AWS_REGION }} \
            --query "services[0].{status:status,desiredCount:desiredCount,runningCount:runningCount}"
