name: ShopSmart Master Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install & Test
        working-directory: client
        run: |
          npm install
          npm run lint
          mkdir -p test-results
          npm run test -- --run --reporter=junit --outputFile=./test-results/vitest-junit.xml

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-vitest-report
          path: client/test-results/vitest-junit.xml

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install & Test
        working-directory: server
        run: |
          npm install
          npm run lint
          mkdir -p test-results
          npm test -- --json --outputFile=./test-results/jest-results.json

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jest-report
          path: server/test-results/jest-results.json

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm install
          npx playwright install --with-deps chromium
          cd client && npm install && npm run build

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    name: Infrastructure & Deployment
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, e2e-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          REGION=$(echo "${{ secrets.AWS_REGION || 'us-east-1' }}" | xargs)
          BUCKET=$(echo "${{ secrets.TERRAFORM_STATE_BUCKET }}" | xargs)
          terraform init \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=$REGION"
        working-directory: ./terraform

      - name: Terraform Apply Prerequisites (ECR/S3)
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -target=aws_s3_bucket.app_bucket \
            -target=aws_s3_bucket_versioning.app_bucket_versioning \
            -target=aws_s3_bucket_server_side_encryption_configuration.app_bucket_encryption \
            -target=aws_s3_bucket_public_access_block.app_bucket_public_access
        working-directory: ./terraform

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shopsmartrevised-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Terraform Apply Full Infrastructure
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve
        working-directory: ./terraform

      - name: Verify ECS Stability
        run: |
          aws ecs wait services-stable \
            --cluster shopsmartrevised-cluster \
            --services shopsmartrevised-service \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}
