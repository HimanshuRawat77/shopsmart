name: ShopSmart CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

  deploy:
    name: Terraform, Docker, and ECS Deploy
    runs-on: ubuntu-latest
    needs: [frontend-build]
    
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init with S3 State
        run: |
          REGION=$(echo "${{ secrets.AWS_REGION || 'us-east-1' }}" | xargs)
          BUCKET=$(echo "${{ secrets.TERRAFORM_STATE_BUCKET }}" | xargs)
          
          terraform init \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=$REGION"
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: terraform plan -out=tfplan
        working-directory: ./terraform

      - name: Terraform Apply Infrastructure Prerequisites (Create ECR)
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -target=aws_s3_bucket.app_bucket \
            -target=aws_s3_bucket_versioning.app_bucket_versioning \
            -target=aws_s3_bucket_server_side_encryption_configuration.app_bucket_encryption \
            -target=aws_s3_bucket_public_access_block.app_bucket_public_access
        working-directory: ./terraform

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shopsmartrevised-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Terraform Apply ECS Deployment
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve
        working-directory: ./terraform

      - name: Verify ECS Service
        run: |
          aws ecs wait services-stable \
            --cluster shopsmartrevised-cluster \
            --services shopsmartrevised-service \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

          aws ecs describe-services \
            --cluster shopsmartrevised-cluster \
            --services shopsmartrevised-service \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} \
            --query "services[0].{status:status,desiredCount:desiredCount,runningCount:runningCount}"
